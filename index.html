<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madhav Hacker - Password Generator</title>
    <style>
        /* Cyberpunk/Hacker Dark Theme Styles */
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: rgba(22, 27, 34, 0.9);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px #238636;
            border: 2px solid #238636;
            text-align: center;
            width: 90%;
            max-width: 450px;
        }

        h1 {
            color: #39ff14; /* Neon Green */
            text-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14;
            margin-bottom: 5px;
            font-size: 28px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .yt-btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 0 10px #ff0000;
            transition: 0.3s;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }

        .yt-btn:hover {
            background-color: #cc0000;
            box-shadow: 0 0 15px #ff0000;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 8px #58a6ff;
        }

        .gen-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .gen-btn:hover {
            background-color: #2ea043;
            box-shadow: 0 0 12px #2ea043;
        }

        #result {
            margin-top: 25px;
            font-size: 18px;
            min-height: 24px;
            word-break: break-all;
        }

        /* Copy Button Style */
        .copy-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            display: none; 
            transition: 0.2s;
        }
        .copy-btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        .error {
            color: #ff7b72 !important;
            text-shadow: 0 0 5px #ff7b72;
        }

        .success {
            color: #58a6ff !important;
            text-shadow: 0 0 5px #58a6ff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MADHAV HACKER</h1>
    <div class="subtitle">SYSTEM PASSWORD GENERATOR</div>

    <a href="https://www.youtube.com/@KryzonTechX" target="_blank" class="yt-btn" onclick="registerClick()">🔴 STEP 1: Subscribe YouTube Channel</a>

    <input type="text" id="linkInput" placeholder="Paste Insta URL here...">
    
    <button class="gen-btn" onclick="generatePassword()">STEP 2: Generate Password</button>

    <h3 id="result"></h3>
    
    <button class="copy-btn" id="copyBtn" onclick="copyPassword()">📋 Copy Password</button>
</div>

<script>
let hasVisitedYT = localStorage.getItem("visitedKryzon") === "true";

function registerClick() {
    localStorage.setItem("visitedKryzon", "true");
    hasVisitedYT = true;
}

function generatePassword() {
    const inputVal = document.getElementById("linkInput").value.trim();
    const resultDiv = document.getElementById("result");
    const copyBtn = document.getElementById("copyBtn");

    copyBtn.style.display = "none";

    // 1. URL Check
    if (inputVal === "") {
        resultDiv.innerText = "❌ Error: Please paste a URL first!";
        resultDiv.className = "error";
        return;
    }

    // 2. YouTube Visit Check
    if (!hasVisitedYT) {
        resultDiv.innerText = "🔒 Access Denied: Please complete STEP 1 (Subscribe Channel) first!";
        resultDiv.className = "error";
        return;
    }

    // Hacker feel delay
    resultDiv.innerText = "⚡ Accessing Mainframe... Bypassing Firewalls...";
    resultDiv.className = "success";

    setTimeout(() => {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$&!%*";
        let password = "";

        for (let i = 0; i < 12; i++) { 
            password += chars.charAt(Math.floor(Math.random() * chars.length));
        }

        generatedPasswordString = password; 
        resultDiv.innerText = "🔑 Password: " + password;
        resultDiv.className = "success";
        
        copyBtn.style.display = "inline-block";
        copyBtn.innerText = "📋 Copy Password";
    }, 2500); 
}

let generatedPasswordString = "";
function copyPassword() {
    if (generatedPasswordString !== "") {
        navigator.clipboard.writeText(generatedPasswordString);
        const copyBtn = document.getElementById("copyBtn");
        copyBtn.innerText = "✅ Copied!";
    }
}
</script>

</body>
</html>
